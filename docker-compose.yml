services:
  api:
    build:
      context: .
    image: gsb-weighbill-api:1.0.0
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/weights.db
    volumes:
      - gsb-sqlite-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  gsb-sqlite-data:
